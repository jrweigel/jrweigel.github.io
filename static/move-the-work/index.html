<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Move the Work — audit your work for AI leverage in 30 minutes. Hand the toil to AI. Reclaim the work that only you can do.">
<meta name="color-scheme" content="light dark">
<title>Move the Work</title>
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
    const stored = (() => { try { return localStorage.getItem("mtw:theme"); } catch (_) { return null; } })();
    const prefersDark = (typeof window.matchMedia === "function") && window.matchMedia("(prefers-color-scheme: dark)").matches;
    const theme = param || stored || (prefersDark ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
:root{
  color-scheme:light;
  --cp-bg:#f7f4ef;
  --cp-bg-elevated:#fcfbf8;
  --cp-surface:#ffffff;
  --cp-surface-soft:#f5f5f5;
  --cp-border:#dedede;
  --cp-border-strong:#919191;
  --cp-text:#242424;
  --cp-text-muted:#5c5c5c;
  --cp-text-soft:#6f6f6f;
  --cp-accent:#b11f4b;
  --cp-accent-hover:#9a1a41;
  --cp-accent-soft:rgba(177,31,75,0.08);
  --cp-accent-fg:#ffffff;
  --cp-success:#16a34a;
  --cp-danger:#dc2626;
  --cp-warning:#f59e0b;
  --cp-link:#0078d4;
  --cp-shadow:0 18px 48px rgba(0,0,0,0.12);
  --cp-overlay:rgba(255,255,255,0.8);
  --cp-panel:rgba(255,255,255,0.86);
  --cp-panel-strong:rgba(255,255,255,0.96);
  --cp-sheen:rgba(255,255,255,0.55);
  --cp-highlight:rgba(177,31,75,0.12);
  --b1-color:#f59e0b; --b1-soft:rgba(245,158,11,0.12);
  --b2-color:#0078d4; --b2-soft:rgba(0,120,212,0.12);
  --b3-color:#16a34a; --b3-soft:rgba(22,163,74,0.12);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --cp-bg:#3d3b3a;
  --cp-bg-elevated:#343231;
  --cp-surface:#292929;
  --cp-surface-soft:#2e2e2e;
  --cp-border:#474747;
  --cp-border-strong:#5f5f5f;
  --cp-text:#dedede;
  --cp-text-muted:#919191;
  --cp-text-soft:#b0b0b0;
  --cp-accent:#fd8ea1;
  --cp-accent-hover:#fb7b91;
  --cp-accent-soft:rgba(253,142,161,0.14);
  --cp-accent-fg:#1a1a1a;
  --cp-success:#4ade80;
  --cp-danger:#f87171;
  --cp-warning:#fbbf24;
  --cp-link:#4da6ff;
  --cp-shadow:0 18px 48px rgba(0,0,0,0.32);
  --cp-overlay:rgba(41,41,41,0.88);
  --cp-panel:rgba(41,41,41,0.72);
  --cp-panel-strong:rgba(41,41,41,0.96);
  --cp-sheen:rgba(255,255,255,0.04);
  --cp-highlight:rgba(253,142,161,0.12);
  --b1-color:#fbbf24; --b1-soft:rgba(251,191,36,0.16);
  --b2-color:#4da6ff; --b2-soft:rgba(77,166,255,0.16);
  --b3-color:#4ade80; --b3-soft:rgba(74,222,128,0.16);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--cp-bg);
  color:var(--cp-text);
  font-family:"Segoe UI",Aptos,Calibri,-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--cp-link);text-underline-offset:3px}
code,pre{font-family:Consolas,"Courier New",Courier,monospace;font-size:0.92em}
pre{
  background:var(--cp-surface-soft);
  border:1px solid var(--cp-border);
  border-radius:10px;
  padding:14px 16px;
  overflow-x:auto;
  white-space:pre-wrap;
  word-break:break-word;
  margin:0;
}
hr{border:none;border-top:1px solid var(--cp-border);margin:24px 0}
h1,h2,h3,h4{line-height:1.25;margin:0 0 12px 0;font-weight:600}
h1{font-size:1.9rem;letter-spacing:-0.01em}
h2{font-size:1.4rem;letter-spacing:-0.005em}
h3{font-size:1.1rem}
p{margin:0 0 12px 0;color:var(--cp-text)}
small,.muted{color:var(--cp-text-muted);font-size:0.92em}
.soft{color:var(--cp-text-soft)}
input[type=text],input[type=date],textarea,select{
  font:inherit; color:inherit;
  background:var(--cp-surface);
  border:1px solid var(--cp-border);
  border-radius:10px;
  padding:10px 12px;
  width:100%;
  outline:none;
}
textarea{resize:vertical;min-height:80px;line-height:1.45}
input:focus,textarea:focus,select:focus{
  border-color:var(--cp-accent);
  box-shadow:0 0 0 3px var(--cp-accent-soft);
}
label{display:block;font-size:0.92rem;color:var(--cp-text-muted);margin-bottom:4px}
.field{margin-bottom:14px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row > *{flex:1;min-width:0}
.cluster{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.spacer{height:16px}
.spacer-lg{height:28px}
.right{margin-left:auto}
.center{text-align:center}
.hidden{display:none !important}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--cp-surface);
  color:var(--cp-text);
  border:1px solid var(--cp-border);
  border-radius:10px;
  padding:9px 16px;
  font:inherit;font-weight:500;
  cursor:pointer;
  transition:background 120ms ease,border-color 120ms ease,transform 60ms ease;
  text-decoration:none;
  line-height:1.2;
}
.btn:hover{background:var(--cp-surface-soft);border-color:var(--cp-border-strong)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-primary{background:var(--cp-accent);color:var(--cp-accent-fg);border-color:var(--cp-accent)}
.btn-primary:hover{background:var(--cp-accent-hover);border-color:var(--cp-accent-hover)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--cp-text-muted)}
.btn-ghost:hover{background:var(--cp-surface-soft);color:var(--cp-text)}
.btn-danger{color:var(--cp-danger);border-color:transparent;background:transparent}
.btn-danger:hover{background:var(--cp-surface-soft)}
.btn-sm{padding:6px 12px;font-size:0.92em}
.btn-xs{padding:4px 10px;font-size:0.85em;border-radius:8px}
.btn-block{width:100%;justify-content:center}
.card{
  background:var(--cp-surface);
  border:1px solid var(--cp-border);
  border-radius:16px;
  padding:24px;
  box-shadow:0 0 2px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.08);
}
.card + .card{margin-top:16px}
.card-soft{background:var(--cp-surface-soft)}
.card-tight{padding:16px}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--cp-surface-soft);
  border:1px solid var(--cp-border);
  color:var(--cp-text-muted);
  border-radius:999px;
  padding:3px 10px;
  font-size:0.82rem;
  font-weight:500;
}
.badge-accent{background:var(--cp-accent-soft);border-color:transparent;color:var(--cp-accent)}
.badge-b1{background:var(--b1-soft);border-color:transparent;color:var(--b1-color);font-weight:600}
.badge-b2{background:var(--b2-soft);border-color:transparent;color:var(--b2-color);font-weight:600}
.badge-b3{background:var(--b3-soft);border-color:transparent;color:var(--b3-color);font-weight:600}
.badge-unsorted{background:var(--cp-surface-soft);border-color:transparent;color:var(--cp-text-muted)}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--cp-surface);
  border:1px solid var(--cp-border);
  color:var(--cp-text);
  border-radius:999px;
  padding:6px 14px;
  font-size:0.92rem;
  cursor:pointer;
  transition:background 120ms ease,border-color 120ms ease;
}
.chip:hover{background:var(--cp-surface-soft);border-color:var(--cp-border-strong)}
.chip-on{background:var(--cp-accent-soft);border-color:var(--cp-accent);color:var(--cp-accent);font-weight:500}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--cp-border);margin-bottom:18px;flex-wrap:wrap}
.tab{
  background:transparent;border:none;
  color:var(--cp-text-muted);
  padding:10px 16px;
  font:inherit;cursor:pointer;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
}
.tab:hover{color:var(--cp-text)}
.tab-on{color:var(--cp-text);border-bottom-color:var(--cp-accent);font-weight:500}
.page{max-width:880px;margin:0 auto;padding:24px 20px 80px}
.site-header{
  background:var(--cp-bg-elevated);
  border-bottom:1px solid var(--cp-border);
  padding:12px 20px;
  position:sticky;top:0;z-index:10;
  backdrop-filter:saturate(120%) blur(6px);
}
.site-header-inner{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;letter-spacing:-0.01em;font-size:1.1rem;color:var(--cp-text);text-decoration:none}
.brand span{color:var(--cp-accent)}
.tagline-mini{color:var(--cp-text-muted);font-size:0.88rem}
.header-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.icon-btn{
  width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;
  background:transparent;border:none;border-radius:8px;cursor:pointer;color:var(--cp-text-muted);
}
.icon-btn:hover{background:var(--cp-surface-soft);color:var(--cp-text)}
.icon-btn svg{width:18px;height:18px}
.save-pulse{display:inline-flex;align-items:center;gap:6px;color:var(--cp-text-muted);font-size:0.85rem}
.save-pulse .dot{width:8px;height:8px;border-radius:50%;background:var(--cp-success);opacity:0.4;transition:opacity 240ms ease}
.save-pulse.saving .dot{background:var(--cp-warning);opacity:1}
.save-pulse.saved .dot{opacity:1}
.step-nav{
  background:var(--cp-bg-elevated);
  border-bottom:1px solid var(--cp-border);
  padding:8px 20px;
}
.step-nav-inner{max-width:880px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.step-nav-inner::-webkit-scrollbar{display:none}
.step-pill{
  background:transparent;border:1px solid transparent;
  color:var(--cp-text-muted);
  padding:6px 12px;border-radius:999px;
  font:inherit;font-size:0.88rem;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;
}
.step-pill:hover{background:var(--cp-surface-soft);color:var(--cp-text)}
.step-pill-active{background:var(--cp-accent);color:var(--cp-accent-fg);border-color:var(--cp-accent);font-weight:500}
.step-pill-active:hover{background:var(--cp-accent-hover);color:var(--cp-accent-fg)}
.step-pill-done{color:var(--cp-text)}
.step-pill-done::before{content:"✓";color:var(--cp-success);font-weight:700;margin-right:2px}
.step-pill-locked{opacity:0.5;cursor:not-allowed}
.bucket-bar{display:flex;align-items:stretch;gap:6px;width:100%;height:48px;border-radius:12px;overflow:hidden;background:var(--cp-surface-soft);border:1px solid var(--cp-border)}
.bucket-bar > div{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:0.92rem;min-width:0;transition:flex 240ms ease}
.bucket-bar .seg-b1{background:var(--b1-color)}
.bucket-bar .seg-b2{background:var(--b2-color)}
.bucket-bar .seg-b3{background:var(--b3-color)}
.bucket-bar .seg-empty{background:transparent;color:var(--cp-text-muted);border:1px dashed var(--cp-border)}
.bucket-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.bucket-stat{background:var(--cp-surface-soft);border:1px solid var(--cp-border);border-radius:12px;padding:14px}
.bucket-stat-num{font-size:1.7rem;font-weight:700;line-height:1}
.bucket-stat-label{font-size:0.85rem;color:var(--cp-text-muted);margin-top:4px}
.bucket-stat-name{font-weight:600;font-size:0.95rem;margin-bottom:4px}
.bucket-stat.b1 .bucket-stat-num{color:var(--b1-color)}
.bucket-stat.b2 .bucket-stat-num{color:var(--b2-color)}
.bucket-stat.b3 .bucket-stat-num{color:var(--b3-color)}
.zone-card{padding:18px 22px;border-radius:14px;display:flex;gap:14px;align-items:flex-start;border:1px solid var(--cp-border);background:var(--cp-surface)}
.zone-red{border-color:var(--cp-danger);background:rgba(220,38,38,0.06)}
.zone-yellow{border-color:var(--cp-warning);background:rgba(245,158,11,0.07)}
.zone-green{border-color:var(--cp-success);background:rgba(22,163,74,0.06)}
.zone-label{font-weight:700;font-size:1rem;display:inline-block;padding:4px 10px;border-radius:8px;color:#fff;letter-spacing:0.04em}
.zone-red .zone-label{background:var(--cp-danger)}
.zone-yellow .zone-label{background:var(--cp-warning)}
.zone-green .zone-label{background:var(--cp-success)}
.diag-q{background:var(--cp-surface-soft);border:1px solid var(--cp-border);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.diag-q-text{font-weight:500;margin-bottom:10px}
.diag-q .cluster{gap:6px}
.yn-btn{border:1px solid var(--cp-border);background:var(--cp-surface);color:var(--cp-text);padding:5px 14px;border-radius:999px;font:inherit;font-size:0.9em;cursor:pointer}
.yn-btn:hover{border-color:var(--cp-border-strong)}
.yn-btn.on-yes{background:var(--cp-accent);color:var(--cp-accent-fg);border-color:var(--cp-accent)}
.yn-btn.on-no{background:var(--cp-text-muted);color:var(--cp-bg);border-color:var(--cp-text-muted)}
.yn-btn.on-skip{background:var(--cp-surface-soft);color:var(--cp-text-muted);border-color:var(--cp-border)}
.bucket-choice{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
@media (max-width:600px){.bucket-choice{grid-template-columns:repeat(2,1fr)}}
.bucket-btn{
  border:1px solid var(--cp-border);background:var(--cp-surface);
  padding:12px 8px;border-radius:12px;cursor:pointer;font:inherit;
  display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;
}
.bucket-btn:hover{border-color:var(--cp-border-strong)}
.bucket-btn-b1.on{background:var(--b1-soft);border-color:var(--b1-color);color:var(--b1-color)}
.bucket-btn-b2.on{background:var(--b2-soft);border-color:var(--b2-color);color:var(--b2-color)}
.bucket-btn-b3.on{background:var(--b3-soft);border-color:var(--b3-color);color:var(--b3-color)}
.bucket-btn-unsorted.on{background:var(--cp-surface-soft);border-color:var(--cp-border-strong);color:var(--cp-text)}
.bucket-btn .num{font-weight:700;font-size:0.92rem}
.bucket-btn .name{font-weight:600;font-size:0.95rem}
.bucket-btn .hint{font-size:0.78rem;color:var(--cp-text-muted)}
.bucket-btn.on .hint{color:inherit;opacity:0.85}
.task-list-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--cp-border);border-radius:10px;background:var(--cp-surface)}
.task-list-row + .task-list-row{margin-top:8px}
.task-list-row .name{flex:1;min-width:0;font-weight:500}
.task-list-row .meta{color:var(--cp-text-muted);font-size:0.88rem}
.task-list-row .actions{display:flex;gap:4px}
.prog{height:6px;background:var(--cp-surface-soft);border-radius:999px;overflow:hidden;margin-bottom:18px}
.prog > div{height:100%;background:var(--cp-accent);transition:width 240ms ease}
.mini-lesson{border-left:3px solid var(--cp-accent);background:var(--cp-accent-soft);padding:12px 14px;border-radius:0 10px 10px 0;margin:14px 0;font-size:0.95em}
.mini-lesson h4{margin:0 0 6px 0;color:var(--cp-accent);font-size:1rem}
.mini-lesson p{margin:0;color:var(--cp-text)}
.callout{background:var(--cp-surface-soft);border:1px solid var(--cp-border);border-radius:12px;padding:14px;margin-top:14px;font-size:0.95em;color:var(--cp-text-muted)}
.callout strong{color:var(--cp-text)}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:var(--cp-text);color:var(--cp-bg);
  padding:10px 18px;border-radius:999px;font-size:0.92rem;font-weight:500;
  box-shadow:var(--cp-shadow);
  opacity:0;pointer-events:none;transition:opacity 180ms ease,transform 180ms ease;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
.dropzone{border:2px dashed var(--cp-border);border-radius:14px;padding:24px;text-align:center;color:var(--cp-text-muted);cursor:pointer;transition:background 120ms ease,border-color 120ms ease}
.dropzone:hover,.dropzone.on{background:var(--cp-accent-soft);border-color:var(--cp-accent);color:var(--cp-accent)}
.kbd{font-family:Consolas,monospace;font-size:0.82em;background:var(--cp-surface-soft);border:1px solid var(--cp-border);border-radius:6px;padding:1px 6px}
@media print{
  .site-header,.step-nav,.toast,.no-print{display:none !important}
  .page{padding:0;max-width:none}
  .card{box-shadow:none;border-color:#ccc;break-inside:avoid}
}
</style>
</head>
<body>
<header class="site-header">
  <div class="site-header-inner">
    <a class="brand" href="#" data-act="home">Move <span>the</span> Work</a>
    <span class="tagline-mini hidden-mobile">Hand the toil to AI. Reclaim the work that only you can do.</span>
    <div class="header-actions">
      <span id="savePulse" class="save-pulse"><span class="dot"></span><span class="label">Saved</span></span>
      <button class="icon-btn" data-act="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </div>
</header>
<nav class="step-nav"><div class="step-nav-inner" id="stepNav"></div></nav>
<main class="page" id="app"></main>
<div class="toast" id="toast"></div>
<input type="file" id="filePicker" accept=".json,application/json" class="hidden">
<script>

/* ==========================================================================
   Move the Work — Constants & content
   ========================================================================== */
const SCHEMA_VERSION = "1.0.0";
const APP_VERSION = "0.1.0";
const STORAGE_PREFIX = "mtw:session:";
const STORAGE_THEME_KEY = "mtw:theme";

const HANDOFF = {
  tool: "ai-workflow-designer",
  reason: "Go deeper on each responsibility — get a Prompt Pack and AI Action Plan for the full set.",
  url: "https://github.com/jrweigel/ai-workflow-designer"
};

const BUCKETS = {
  automate: { num: 1, name: "Automate",       short: "B1", color: "var(--b1-color)", soft: "var(--b1-soft)", badge: "badge-b1",
              hint: "AI does it", intent: "offload",
              moveLabel: "Offload — who or what takes this off your plate?" },
  assist:   { num: 2, name: "Assist",         short: "B2", color: "var(--b2-color)", soft: "var(--b2-soft)", badge: "badge-b2",
              hint: "AI + you",   intent: "amplify",
              moveLabel: "Amplify — which AI tool fits, and what's the starter prompt?" },
  human:    { num: 3, name: "Human",          short: "B3", color: "var(--b3-color)", soft: "var(--b3-soft)", badge: "badge-b3",
              hint: "Only you",   intent: "protect",
              moveLabel: "Protect — how do you invest more time here?" },
  unsorted: { num: 0, name: "Unsorted",       short: "—",  color: "var(--cp-text-muted)", soft: "var(--cp-surface-soft)", badge: "badge-unsorted",
              hint: "Not placed", intent: "hold",
              moveLabel: "Hold — sort this first or decide what to do." }
};

const INTENTS = {
  offload: { name: "Offload", desc: "Take it off your plate — AI or someone else owns it." },
  amplify: { name: "Amplify", desc: "Pair with AI to do it better and faster." },
  protect: { name: "Protect", desc: "Invest more time — this is your durable advantage." },
  hold:    { name: "Hold",    desc: "Not now. Re-evaluate next time." }
};

const DIAGNOSTICS = [
  { id: "couldAnyoneDoIt",           text: "Could someone else do this exactly the same way I do?",                bucket: "automate", weight: 2 },
  { id: "hasClearRightAndWrong",     text: "Does it have clear right and wrong answers?",                          bucket: "automate", weight: 2 },
  { id: "needsContextNotInData",     text: "Does it require context that isn't in any database or document?",      bucket: "assist",   weight: 2 },
  { id: "needsExperienceJudgment",   text: "Does it need experience-based judgment to do well?",                   bucket: "assist",   weight: 1, alsoHuman: 1 },
  { id: "needsTrustOrEmotionalRead", text: "Does it depend on reading emotions or building trust?",                bucket: "human",    weight: 2 },
  { id: "involvesEthicalJudgment",   text: "Does it involve ethical judgment or navigating competing interests?",  bucket: "human",    weight: 2 }
];

const MINI_LESSONS = {
  automate: {
    title: "Bucket 1 — AI Automates",
    body: "Tasks where being human adds no special value. Rules, structured data, clear right/wrong. Examples: standard status reports from data, FAQ answers, ticket routing, boilerplate drafts. If a perfectly accurate machine would do it better than a sleep-deprived human at 4pm — Bucket 1."
  },

function uuid() {
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  // RFC4122 v4 fallback
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
    const r = Math.random() * 16 | 0;
    return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

function nowIso() { return new Date().toISOString(); }

function freshSession() {
  const t = nowIso();
  return {
    schemaVersion: SCHEMA_VERSION,
    meta: {
      sessionId: uuid(),
      runNumber: 1,
      createdAt: t,
      updatedAt: t,
      completedAt: null,
      surface: "web-companion",
      previousRunSessionRef: null,
      tags: []
    },
    person: { name: "", role: "", discipline: "", team: "", org: "", tenure: "" },
    preferences: { preSeedSource: "none", shareWithFacilitator: false },
    tasks: [],
    assessment: emptyAssessment(),
    plan: { topMovesThisWeek: [], ninetyDayTrajectory: { targetAutomatePercent: null, targetAssistPercent: null, targetHumanPercent: null, narrative: "" }, handoffs: [HANDOFF] }
  };
}

function emptyAssessment() {
  return {
    bucketTotals:   { automate: 0, assist: 0, human: 0, unsorted: 0 },
    bucketPercents: { automate: 0, assist: 0, human: 0 },
    zone: "unknown",
    vulnerabilityRead: { bucket2Empty: false, bucket3Thin: false, summary: "" }
  };
}

// ---- persistence ----

function storageKey(sid) { return STORAGE_PREFIX + sid; }

function save({ silent = false } = {}) {
  try {
    session.meta.updatedAt = nowIso();
    localStorage.setItem(storageKey(session.meta.sessionId), JSON.stringify(session));
    if (!silent) flashSave();
  } catch (e) { /* private mode, etc. — ignore */ }
}

function listSavedSessions() {
  const out = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(STORAGE_PREFIX)) {
        try {
          const v = JSON.parse(localStorage.getItem(k));
          if (v && v.meta) out.push(v);
        } catch (_) { /* skip */ }
      }
    }
  } catch (_) { /* ignore */ }
  out.sort((a, b) => (b.meta.updatedAt || "").localeCompare(a.meta.updatedAt || ""));
  return out;
}

function deleteSavedSession(sid) {
  try { localStorage.removeItem(storageKey(sid)); } catch (_) { /* ignore */ }
}

function loadSession(sid) {
  try {
    const raw = localStorage.getItem(storageKey(sid));
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || !data.meta) return false;
    session = data;
    ensureSessionShape();
    return true;
  } catch (_) { return false; }
}

function ensureSessionShape() {
  // tolerate older / partial sessions
  if (!session.schemaVersion) session.schemaVersion = SCHEMA_VERSION;
  if (!session.meta) session.meta = freshSession().meta;
  if (!session.person) session.person = freshSession().person;
  if (!session.preferences) session.preferences = freshSession().preferences;
  if (!Array.isArray(session.tasks)) session.tasks = [];
  if (!session.assessment) session.assessment = emptyAssessment();
  if (!session.plan) session.plan = freshSession().plan;
  if (!Array.isArray(session.plan.handoffs)) session.plan.handoffs = [HANDOFF];
  if (!session.plan.ninetyDayTrajectory) session.plan.ninetyDayTrajectory = { targetAutomatePercent: null, targetAssistPercent: null, targetHumanPercent: null, narrative: "" };
  if (!Array.isArray(session.plan.topMovesThisWeek)) session.plan.topMovesThisWeek = [];
  session.tasks.forEach((t) => {
    if (!t.id) t.id = slugify(t.label || "task") + "-" + Math.random().toString(36).slice(2, 6);
    if (!t.bucket) t.bucket = "unsorted";
    if (!t.diagnostic) t.diagnostic = {};
    if (typeof t.effortWeight !== "number") {
      t.effortWeight = typeof t.estWeeklyHours === "number" ? t.estWeeklyHours : 1;
    }
    if (!t.source) t.source = "user";
    if (!t.tags) t.tags = [];
  });
}

function slugify(s) {
  return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "task";
}

// ---- computation ----

function computeAssessment() {
  const totals = { automate: 0, assist: 0, human: 0, unsorted: 0 };
  for (const t of session.tasks) {
    const w = typeof t.effortWeight === "number" && t.effortWeight > 0
      ? t.effortWeight
      : (typeof t.estWeeklyHours === "number" && t.estWeeklyHours > 0 ? t.estWeeklyHours : 1);
    totals[t.bucket || "unsorted"] += w;
  }
  const sorted = totals.automate + totals.assist + totals.human;
  const pct = { automate: 0, assist: 0, human: 0 };
  if (sorted > 0) {
    pct.automate = +(totals.automate / sorted * 100).toFixed(1);
    pct.assist   = +(totals.assist   / sorted * 100).toFixed(1);
    pct.human    = +(totals.human    / sorted * 100).toFixed(1);
  }
  let zone = "unknown";
  if (sorted > 0) {
    if (pct.automate > 50) zone = "red";
    else if (pct.automate >= 40) zone = "yellow";
    else zone = "green";
  }
  const bucket2Empty = sorted > 0 && pct.assist < 15;
  const bucket3Thin = sorted > 0 && pct.human < 30;
  const summary = buildVulnerabilitySummary(zone, pct, bucket2Empty, bucket3Thin);
  session.assessment = {
    bucketTotals: totals,
    bucketPercents: pct,
    zone,
    vulnerabilityRead: { bucket2Empty, bucket3Thin, summary }
  };
  return session.assessment;
}

function buildVulnerabilitySummary(zone, pct, b2Empty, b3Thin) {
  if (zone === "unknown") return "Sort some tasks to see your zone.";
  const parts = [];
  if (zone === "red") {
    parts.push("You're in the <strong>red zone</strong> — more than half of your effort is in work AI can do alone. Your job isn't being upended someday; it's being upended right now. Move fast on offloading Bucket 1 work so you have time to grow Bucket 2 and 3.");
  } else if (zone === "yellow") {
    parts.push("You're in the <strong>yellow zone</strong> — a big chunk of your effort is in work AI can do. The clock is ticking. Start offloading Bucket 1 deliberately, and use the time to build your Bucket 2 and 3 capabilities.");
  } else {
    parts.push("You're in the <strong>green zone</strong>, for now. The percentages keep shifting toward more AI-doable work — that's the conveyor belt. Green today is not green forever.");
  }
  if (b2Empty && b3Thin) {
    parts.push("Both your Bucket 2 and Bucket 3 are underdeveloped. Bucket 2 is where new value gets created with AI; Bucket 3 is your durable advantage. Right now you have neither working for you — that's the most urgent thing to change.");
  } else if (b2Empty) {
    parts.push("Your <strong>Bucket 2 is nearly empty</strong> (under 15%). That's the biggest <em>missed opportunity</em> in this era of work — the hybrid human-plus-AI tasks are where new value is being created. If you're not building Bucket 2, you're leaving leverage on the table.");
  } else if (b3Thin) {
    parts.push("Your <strong>Bucket 3 is thin</strong> (under 30%). The irreplaceable human work — trust, judgment, navigating ambiguity — is what protects your career across whatever the next disruption is. Worth investing more here.");
  } else if (zone === "green") {
    parts.push("Your bucket mix is healthy. Keep the conveyor belt moving — keep nudging tasks from 1 → 2, and keep growing 3.");
  }
  return parts.join(" ");
}

function computeDiff() {
  if (!priorSession || !priorSession.tasks) return null;
  const prior = priorSession.tasks;
  const now = session.tasks;
  const priorById = new Map(prior.map((t) => [t.id, t]));
  const nowById = new Map(now.map((t) => [t.id, t]));
  const added = [], removed = [], moved = [];
  for (const t of now) if (!priorById.has(t.id)) added.push(t);
  for (const t of prior) if (!nowById.has(t.id)) removed.push(t);
  for (const t of now) {
    const p = priorById.get(t.id);
    if (p && p.bucket && t.bucket && p.bucket !== t.bucket) {
      moved.push({ taskId: t.id, label: t.label, fromBucket: p.bucket, toBucket: t.bucket });
    }
  }
  const ap = (session.assessment && session.assessment.bucketPercents) || { automate: 0, assist: 0, human: 0 };
  const pp = (priorSession.assessment && priorSession.assessment.bucketPercents) || { automate: 0, assist: 0, human: 0 };
  const delta = {
    automate: +(ap.automate - pp.automate).toFixed(1),
    assist:   +(ap.assist   - pp.assist).toFixed(1),
    human:    +(ap.human    - pp.human).toFixed(1)
  };
  const narrative = buildDiffNarrative(delta, added, removed, moved);
  return { tasksAdded: added.map((t) => t.id), tasksRemoved: removed.map((t) => t.id), tasksMovedBucket: moved, trajectoryDelta: delta, narrative, _addedFull: added, _removedFull: removed };
}

function buildDiffNarrative(delta, added, removed, moved) {
  const parts = [];
  parts.push(`Since your last run, ${added.length} new task${added.length === 1 ? "" : "s"} appeared, ${removed.length} dropped off, and ${moved.length} moved bucket.`);
  const goodDir = delta.automate < 0 && (delta.assist > 0 || delta.human > 0);
  const wrongDir = delta.automate > 0 && (delta.assist < 0 || delta.human < 0);
  if (goodDir) parts.push("Your trajectory is in the right direction — less Bucket 1, more 2 or 3. Keep going.");
  else if (wrongDir) parts.push("Your trajectory drifted the wrong way this run — more Bucket 1, less of the higher-leverage work. Worth asking what pulled you back.");
  else if (Math.abs(delta.automate) < 2 && Math.abs(delta.assist) < 2 && Math.abs(delta.human) < 2) parts.push("Your mix barely moved. That's fine if you're happy with it — but if you committed to moves last time, look at why they didn't shift the numbers.");
  return parts.join(" ");
}

function buildAiwfdInterop() {
  return {
    responsibilities: session.tasks.map((t) => ({
      title: t.label || "",
      outcome: "",
      cadence: t.cadence || "",
      painPoints: [],

    }))
  };
}

// ---- forgiving paste parser ----

function parsePastedTasks(text) {
  if (!text || !text.trim()) return { ok: false, error: "Paste empty.", tasks: [] };
  let s = String(text).trim();
  // Strip markdown fences
  s = s.replace(/^```(?:json|JSON)?\s*/m, "").replace(/```\s*$/m, "");
  // Trim to first [ ... matching ]
  const firstBracket = s.indexOf("[");
  if (firstBracket > 0) s = s.slice(firstBracket);
  // For top-level object { tasks: [...] }, unwrap
  // Try a few parses
  let parsed = null;
  try { parsed = JSON.parse(s); } catch (_) { /* try harder */ }
  if (!parsed) {
    // Find last ] and slice
    const lastBracket = s.lastIndexOf("]");
    if (lastBracket > 0) {
      try { parsed = JSON.parse(s.slice(0, lastBracket + 1)); } catch (_) {}
    }
  }
  if (!parsed) {
    // Try parsing as object
    const firstBrace = s.indexOf("{");
    const lastBrace = s.lastIndexOf("}");
    if (firstBrace >= 0 && lastBrace > firstBrace) {
      try { parsed = JSON.parse(s.slice(firstBrace, lastBrace + 1)); } catch (_) {}
    }
  }
  if (!parsed) return { ok: false, error: "I couldn't find JSON in that paste. Make sure you copied just the JSON array.", tasks: [] };
  let arr = null;
  if (Array.isArray(parsed)) arr = parsed;
  else if (parsed && Array.isArray(parsed.tasks)) arr = parsed.tasks;
  else if (parsed && Array.isArray(parsed.responsibilities)) arr = parsed.responsibilities;
  else if (parsed && Array.isArray(parsed.inventory)) arr = parsed.inventory;
  if (!arr) return { ok: false, error: "Found JSON but no task list inside it.", tasks: [] };
  const tasks = arr.map((raw, i) => normalizeIncomingTask(raw, i)).filter(Boolean);
  if (tasks.length === 0) return { ok: false, error: "No usable tasks found in the JSON.", tasks: [] };
  return { ok: true, error: null, tasks };
}

function normalizeIncomingTask(raw, idx) {
  if (!raw || typeof raw !== "object") return null;
  const label = String(raw.label || raw.name || raw.title || raw.task || "").trim();
  if (!label) return null;
  const id = raw.id ? String(raw.id) : slugify(label) + "-" + (idx + 1);
  const description = String(raw.description || raw.detail || raw.notes || "").trim();
  const cadenceRaw = String(raw.cadence || raw.frequency || "").toLowerCase().trim();
  const cadenceMap = { day: "daily", daily: "daily", weekly: "weekly", week: "weekly", biweekly: "biweekly", "bi-weekly": "biweekly", monthly: "monthly", month: "monthly", quarterly: "quarterly", quarter: "quarterly", adhoc: "adhoc", "ad-hoc": "adhoc", "ad hoc": "adhoc", asneeded: "adhoc" };
  const cadence = cadenceMap[cadenceRaw] || "unknown";
  let est = Number(raw.estWeeklyHours != null ? raw.estWeeklyHours : raw.weeklyHours != null ? raw.weeklyHours : raw.hoursPerWeek);
  if (!isFinite(est) || est < 0) est = null;
  const source = raw.source || "graph-pre-seed";
  let bucket = String(raw.bucket || "unsorted").toLowerCase();
  if (!["automate", "assist", "human", "unsorted"].includes(bucket)) bucket = "unsorted";
  const evidence = raw.evidence ? String(raw.evidence) : "";
  return {
    id, label, description,
    cadence,
    estWeeklyHours: est,
    effortWeight: est != null && est > 0 ? est : 1,
    source,
    bucket,
    diagnostic: { freeformReasoning: evidence ? `Evidence from inventory: ${evidence}` : "" },
    move: null,
    tags: [],
    notes: ""
  };
}

/* ==========================================================================
   Helpers + render dispatcher

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function html(strings, ...vals) {
  let out = "";
  strings.forEach((s, i) => { out += s; if (i < vals.length) out += escapeHtml(vals[i]); });
  return out;
}

function escapeHtml(s) {
  if (s === null || s === undefined) return "";
  if (typeof s !== "string") return String(s);
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function fmtPct(n) { return Math.round(n) + "%"; }
function fmtDate(iso) {
  if (!iso) return "";
  try {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  } catch (_) { return iso; }
}

let _toastTimer = null;
function toast(msg, ms = 2200) {
  const el = $("#toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove("on"), ms);
}

let _saveTimer = null;
function flashSave() {
  const el = $("#savePulse");
  if (!el) return;
  el.classList.remove("saved");
  el.classList.add("saving");
  $(".label", el).textContent = "Saving";
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => {
    el.classList.remove("saving");
    el.classList.add("saved");
    $(".label", el).textContent = "Saved";
  }, 400);
}

async function copyToClipboard(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (_) {}
  // Fallback: textarea + execCommand
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (_) { return false; }
}

function downloadBlob(filename, content, mime = "application/octet-stream") {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function isStepUnlocked(stepId) {
  if (stepId === "welcome") return true;
  if (stepId === "person") return true;
  if (stepId === "inventory") return true;
  if (stepId === "sort") return session.tasks.length > 0;
  if (stepId === "assess") return session.tasks.some((t) => t.bucket && t.bucket !== "unsorted");
  if (stepId === "move") return session.tasks.some((t) => t.bucket && t.bucket !== "unsorted");
  if (stepId === "plan") return session.tasks.some((t) => t.bucket && t.bucket !== "unsorted");
  if (stepId === "export") return session.tasks.length > 0;
  return true;
}

function go(stepId) {
  if (!isStepUnlocked(stepId)) {
    toast("Finish the earlier steps first.");
    return;
  }
  ui.step = stepId;
  ui.visited.add(stepId);
  try { window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" }); } catch (_) {}
  render();
}

function renderStepNav() {
  const nav = $("#stepNav");
  if (!nav) return;
  nav.innerHTML = STEPS.map((s) => {
    const active = ui.step === s.id;
    const done = !active && ui.visited.has(s.id) && isStepUnlocked(s.id);
    const locked = !isStepUnlocked(s.id);
    const cls = ["step-pill", active && "step-pill-active", done && "step-pill-done", locked && "step-pill-locked"].filter(Boolean).join(" ");
    return `<button class="${cls}" data-step="${s.id}"${locked ? " disabled" : ""}>${escapeHtml(s.short)}</button>`;
  }).join("");
}

function render() {
  // Always recompute assessment before rendering anything that may show it
  computeAssessment();
  renderStepNav();
  const app = $("#app");
  if (!app) return;
  switch (ui.step) {
    case "welcome":   app.innerHTML = renderWelcome(); break;
    case "person":    app.innerHTML = renderPerson(); break;
    case "inventory": app.innerHTML = renderInventory(); break;
    case "sort":      app.innerHTML = renderSort(); break;
    case "assess":    app.innerHTML = renderAssess(); break;
    case "move":      app.innerHTML = renderMove(); break;
    case "plan":      app.innerHTML = renderPlan(); break;
    case "export":    app.innerHTML = renderExport(); break;
    case "diff":      app.innerHTML = renderDiff(); break;
    default:          app.innerHTML = renderWelcome();
  }
  afterRender();
}

function afterRender() {
  // Hook up dynamic field bindings for inputs that update session state on change
  $$("[data-bind]").forEach((el) => {
    const path = el.getAttribute("data-bind");
    el.addEventListener("input", (e) => {
      setPath(session, path, e.target.value);
      save({ silent: true });
    });
    el.addEventListener("change", (e) => {
      setPath(session, path, e.target.value);
      save({ silent: true });
    });
  });
}

function setPath(obj, path, value) {
  const parts = path.split(".");
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    if (cur[parts[i]] === undefined || cur[parts[i]] === null) cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  cur[parts[parts.length - 1]] = value;
}

function getPath(obj, path) {
  const parts = path.split(".");
  let cur = obj;
  for (const p of parts) {
    if (cur === null || cur === undefined) return undefined;
    cur = cur[p];
  }
  return cur;
}

function unsortedTasks() { return session.tasks.filter((t) => t.bucket === "unsorted"); }
function allSorted() { return session.tasks.length > 0 && session.tasks.every((t) => t.bucket && t.bucket !== "unsorted"); }

function clampTaskIdx() {
  if (session.tasks.length === 0) { ui.currentTaskIdx = 0; return; }
  if (ui.currentTaskIdx < 0) ui.currentTaskIdx = 0;
  if (ui.currentTaskIdx >= session.tasks.length) ui.currentTaskIdx = session.tasks.length - 1;
}

function suggestedBucketFor(task) {
  if (!task.diagnostic) return null;
  const scores = { automate: 0, assist: 0, human: 0 };
  let answered = 0;
  for (const q of DIAGNOSTICS) {
    const v = task.diagnostic[q.id];
    if (v === true) {
      scores[q.bucket] += q.weight;
      if (q.alsoHuman) scores.human += q.alsoHuman;
      answered++;
    } else if (v === false) {
      answered++;
    }
  }
  if (answered < 2) return null;
  let best = null, bestScore = -1;
  for (const k of Object.keys(scores)) {
    if (scores[k] > bestScore) { bestScore = scores[k]; best = k; }
  }
  return bestScore > 0 ? best : null;
}

function renderSort() {

  const total = session.tasks.length;
  const idx = ui.currentTaskIdx;

  return `

        const yes = v === true, no = v === false;
        return `

            <div class="diag-q-text">${escapeHtml(q.text)}</div>
            <div class="cluster">
              <button class="yn-btn ${yes ? "on-yes" : ""}" data-act="diag" data-id="${escapeHtml(q.id)}" data-val="yes">Yes</button>
              <button class="yn-btn ${no ? "on-no" : ""}" data-act="diag" data-id="${escapeHtml(q.id)}" data-val="no">No</button>

      ${lesson ? `
        <div class="mini-lesson">

      ${suggested ? `<p class="muted" style="margin-top:-6px">Based on your answers, this looks like <span class="badge ${BUCKETS[suggested].badge}">${BUCKETS[suggested].name}</span>. You can confirm or override.</p>` : `<p class="muted" style="margin-top:-6px">Pick the bucket that feels right.</p>`}

            <button class="bucket-btn bucket-btn-${b === "unsorted" ? "unsorted" : "b" + def.num} ${on ? "on" : ""}" data-act="bucket" data-bucket="${b}">
              ${b !== "unsorted" ? `<span class="num">Bucket ${def.num}${sug ? " · suggested" : ""}</span>` : `<span class="num">${sug ? "suggested" : "Skip for now"}</span>`}
              <span class="name">${escapeHtml(def.name)}</span>
              <span class="hint">${escapeHtml(def.hint)}</span>

        }).join("")}
      </div>

      <div class="field" style="margin-top:18px">
        <label>Your reasoning in a sentence (optional, but worth it)</label>

        <button class="btn" data-act="prev-task"${idx === 0 ? " disabled" : ""}>← Previous</button>

        <button class="btn btn-primary right" data-act="next-task">${idx === total - 1 ? (allSorted() ? "See your map →" : "Finish unsorted later →") : "Next task →"}</button>

    <section class="card">

      <div class="callout">
        <strong>What the zones mean.</strong> Red = more than 50% of your effort is in Bucket 1 (AI can do it). Yellow = 40-50%. Green = under 40%. The percentages keep shifting toward more AI-doable work as the tools get better — green today is not green forever.
      </div>

      <div class="callout" style="border-left-color:var(--b2-color)">
        <strong>Why this matters now.</strong> This isn't about AI replacing you. It's about the <strong>conveyor belt</strong> — every quarter, more of what used to be Bucket 2 becomes Bucket 1 as the models improve. The people who thrive are the ones who keep moving up the stack: offloading Bucket 1 work, building new Bucket 2 skills, and deepening their Bucket 3 capabilities. The audit gives you a starting point. The re-run in 90 days shows you whether you're moving.
      </div>

      <div class="callout" style="border-left-color:var(--b3-color)">
        <strong>Where's the opportunity?</strong> Look at your Bucket 2 — if it's thin, you're missing the biggest leverage in this era. The hybrid human+AI tasks are where new value gets created. Look at your Bucket 3 — if it's thin, you're not building the durable capabilities that protect your career across whatever the next disruption is.
      </div>

      <div class="cluster" style="margin-top:18px">
        <button class="btn" data-act="goto" data-step="sort">← Back to sort</button>
        <button class="btn btn-primary right" data-act="goto" data-step="move">Now move some work →</button>

    </section>
  `;
}

function renderMove() {
  const sortedTasks = session.tasks.filter((t) => t.bucket && t.bucket !== "unsorted");
  if (sortedTasks.length === 0) {
    return `<section class="card"><p>You need to sort some tasks first. <a href="#" data-act="goto" data-step="sort">Go sort →</a></p></section>`;
  }
  // group by bucket
  const byBucket = { automate: [], assist: [], human: [] };
  sortedTasks.forEach((t) => byBucket[t.bucket].push(t));
  return `
    <section class="card">
      <h2>Move some work</h2>
      <p>For each task, decide the next move: <strong>offload</strong> (Bucket 1), <strong>amplify</strong> (Bucket 2), <strong>protect</strong> (Bucket 3), or <strong>hold</strong> (not now). Write the next step.</p>
      <div class="callout" style="border-left-color:var(--b2-color);margin-top:12px">
        <strong>★ Star your top moves</strong> — only starred moves appear on the Plan stage. All moves (starred or not) will be included in the downloadable snapshot.
      </div>
    </section>
    ${["automate","assist","human"].map((b) => byBucket[b].length === 0 ? "" : `
      <section class="card">
        <div class="cluster" style="margin-bottom:12px">
          <span class="badge ${BUCKETS[b].badge}">Bucket ${BUCKETS[b].num} · ${BUCKETS[b].name}</span>
          <span class="muted">${byBucket[b].length} task${byBucket[b].length === 1 ? "" : "s"}</span>
        </div>
        ${b === "automate" ? `<div class="mini-lesson" style="border-left-color:var(--b1-color);background:var(--b1-soft);color:var(--cp-text);margin-bottom:14px">
          <h4 style="color:var(--b1-color);margin-bottom:6px">💡 Ideas for offloading Bucket 1 tasks</h4>
          <ul style="margin:0;padding-left:18px;font-size:0.92rem">
            <li><strong>Delegate to an AI agent</strong> — set up a recurring automation (e.g. Copilot auto-drafts your weekly status from your work items)</li>
            <li><strong>Template + trigger</strong> — create a template and have AI fill it each time (e.g. meeting recap auto-sent after every meeting)</li>
            <li><strong>Hand to a teammate or shared service</strong> — if a human must own it, does it need to be you?</li>
            <li><strong>Eliminate entirely</strong> — ask "if I stopped doing this, who would notice and when?" If the answer is murky, try stopping.</li>
          </ul>
        </div>` : ""}
        ${b === "assist" ? `<div class="mini-lesson" style="border-left-color:var(--b2-color);background:var(--b2-soft);color:var(--cp-text);margin-bottom:14px">
          <h4 style="color:var(--b2-color);margin-bottom:6px">💡 Ideas for amplifying Bucket 2 tasks</h4>
          <ul style="margin:0;padding-left:18px;font-size:0.92rem">
            <li><strong>AI does the first draft, you edit</strong> — emails, docs, plans, reviews. You provide 20% of the effort for 80% of the quality.</li>
            <li><strong>AI preps, you decide</strong> — summarize long threads, pull data, surface options. You bring the judgment.</li>
            <li><strong>Build a reusable prompt or skill</strong> — write one great prompt for this task, save it as a reusable skill, invoke every time.</li>
            <li><strong>Copilot + your files</strong> — point AI at your SharePoint/OneDrive docs and ask it to synthesize, compare, or draft from them.</li>
            <li><strong>Create a custom GPT or Copilot agent</strong> — for recurring assist tasks, build a dedicated mini-tool with instructions baked in.</li>
          </ul>
        </div>` : ""}
        ${b === "human" ? `<div class="mini-lesson" style="border-left-color:var(--b3-color);background:var(--b3-soft);color:var(--cp-text);margin-bottom:14px">
          <h4 style="color:var(--b3-color);margin-bottom:6px">💡 Strengthening your human-only capabilities</h4>
          <p style="font-size:0.9rem;margin:0 0 8px 0">These are the skills that become <em>more</em> valuable as AI improves. Invest here deliberately.</p>
          <ul style="margin:0;padding-left:18px;font-size:0.88rem">
            <li><strong>Problem Framing</strong> — AI answers questions; humans decide which questions matter. Practice asking "is this even the right problem?"</li>
            <li><strong>Judgment & Decision-making</strong> — make calls under uncertainty, competing priorities, and incomplete info. This is why leadership isn't disappearing.</li>
            <li><strong>Systems Thinking</strong> — see second-order effects, dependencies, incentives, and unintended consequences. AI optimizes locally; you optimize systemically.</li>
            <li><strong>Sensemaking</strong> — different from summarization. Summarization = what happened. Sensemaking = what it means.</li>
            <li><strong>Delegation to Agents</strong> — task decomposition, constraint setting, defining success, validation design. Future managers spend more time managing agents than creating deliverables.</li>
            <li><strong>Original Thinking</strong> — when everyone can generate competent outputs, originality becomes the scarce premium.</li>
            <li><strong>Influence & Communication</strong> — organizations still change through people. Simplifying complexity and creating clarity become more valuable as AI increases the volume of everything.</li>
          </ul>
        </div>` : ""}
        <div class="stack">
          ${byBucket[b].map((t) => renderMoveForTask(t)).join("")}

      </div>
    </div>
  `;
}

function renderMoveForTask(t) {

  return `
    <div class="card card-soft card-tight" style="margin:0">
      <div class="cluster" style="margin-bottom:6px">
        <strong style="font-size:1rem">${escapeHtml(t.label)}</strong>

      </div>
      ${t.diagnostic && t.diagnostic.freeformReasoning ? `<p class="muted" style="margin:0 0 10px 0">${escapeHtml(t.diagnostic.freeformReasoning)}</p>` : ""}
      <div class="row">
        <div class="field">
          <label>Intent</label>
          <select data-act="move-intent" data-id="${escapeHtml(t.id)}">

        <div class="field">
          <label>Starter prompt (for the AI tool above)</label>
          <textarea data-act="move-prompt" data-id="${escapeHtml(t.id)}" rows="3" placeholder="A first draft you can paste into the tool. Edit it as you go.">${escapeHtml(m.starterPrompt || "")}</textarea>

      <div class="row">

  `;
}

function renderPlan() {
  const sortedTasks = session.tasks.filter((t) => t.bucket && t.bucket !== "unsorted");

  const enrichedTops = tops.map((mv) => {
    const t = session.tasks.find((x) => x.id === mv.taskId);

    const m = t.move || {};

  return `

function renderDiff() {
  if (!priorSession) {
    return `<section class="card"><p>No prior session loaded. <a href="#" data-act="goto" data-step="welcome">Back to start</a></p></section>`;
  }
  const diff = computeDiff();
  if (!diff) return `<section class="card"><p>Couldn't compute diff.</p></section>`;
  const priorWhen = fmtDate(priorSession.meta.updatedAt || priorSession.meta.createdAt);
  return `
    <section class="card">
      <h2>Welcome back</h2>
      <p>Here's what changed since your <strong>${escapeHtml(priorWhen)}</strong> run (run ${priorSession.meta.runNumber || 1}).</p>
      <p>${diff.narrative}</p>
    </section>

    ${diff._addedFull.length > 0 ? `
      <section class="card">
        <h3>New tasks <span class="badge">${diff._addedFull.length}</span></h3>
        <div class="stack">${diff._addedFull.map((t) => `<div class="task-list-row"><div class="name">${escapeHtml(t.label)}</div><div class="meta">→ ${escapeHtml(BUCKETS[t.bucket || "unsorted"].name)}</div></div>`).join("")}</div>
      </section>` : ""}

    ${diff.tasksMovedBucket.length > 0 ? `
      <section class="card">
        <h3>Moved bucket <span class="badge">${diff.tasksMovedBucket.length}</span></h3>
        <div class="stack">${diff.tasksMovedBucket.map((m) => `<div class="task-list-row"><div class="name">${escapeHtml(m.label || m.taskId)}</div><div class="meta"><span class="badge ${BUCKETS[m.fromBucket].badge}">${BUCKETS[m.fromBucket].name}</span> → <span class="badge ${BUCKETS[m.toBucket].badge}">${BUCKETS[m.toBucket].name}</span></div></div>`).join("")}</div>
      </section>` : ""}

    ${diff._removedFull.length > 0 ? `
      <section class="card">
        <h3>Fell off your plate <span class="badge">${diff._removedFull.length}</span></h3>
        <div class="stack">${diff._removedFull.map((t) => `<div class="task-list-row"><div class="name muted">${escapeHtml(t.label)}</div><div class="meta muted">was: ${escapeHtml(BUCKETS[t.bucket || "unsorted"].name)}</div></div>`).join("")}</div>
      </section>` : ""}

    <section class="card">
      <h3>Trajectory delta</h3>
      <p class="muted">Change in each bucket's percentage since last run.</p>
      <div class="bucket-stats">
        <div class="bucket-stat b1"><div class="bucket-stat-name">Bucket 1</div><div class="bucket-stat-num">${diff.trajectoryDelta.automate > 0 ? "+" : ""}${diff.trajectoryDelta.automate}%</div><div class="bucket-stat-label">${diff.trajectoryDelta.automate < 0 ? "↓ less" : diff.trajectoryDelta.automate > 0 ? "↑ more" : "no change"}</div></div>
        <div class="bucket-stat b2"><div class="bucket-stat-name">Bucket 2</div><div class="bucket-stat-num">${diff.trajectoryDelta.assist > 0 ? "+" : ""}${diff.trajectoryDelta.assist}%</div><div class="bucket-stat-label">${diff.trajectoryDelta.assist > 0 ? "↑ more" : diff.trajectoryDelta.assist < 0 ? "↓ less" : "no change"}</div></div>
        <div class="bucket-stat b3"><div class="bucket-stat-name">Bucket 3</div><div class="bucket-stat-num">${diff.trajectoryDelta.human > 0 ? "+" : ""}${diff.trajectoryDelta.human}%</div><div class="bucket-stat-label">${diff.trajectoryDelta.human > 0 ? "↑ more" : diff.trajectoryDelta.human < 0 ? "↓ less" : "no change"}</div></div>
      </div>
    </section>

    <div class="card card-soft">
      <div class="cluster">
        <button class="btn btn-primary right" data-act="goto" data-step="inventory">Continue with this run →</button>
      </div>
    </div>
  `;
}

function bind() {
  document.addEventListener("click", onClick, false);
  document.addEventListener("keydown", onKey, false);
  document.addEventListener("input", onInput, false);
  document.addEventListener("change", onChange, false);
  $("#stepNav").addEventListener("click", (e) => {
    const b = e.target.closest("[data-step]"); if (!b || b.disabled) return;
    go(b.getAttribute("data-step"));
  });
  $("#filePicker").addEventListener("change", onFile);
}

function onClick(e) {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.getAttribute("data-act");
  switch (act) {
    case "home":
      e.preventDefault(); go("welcome"); break;
    case "theme-toggle":
      toggleTheme(); break;
    case "start-new":
      startNewSession(); break;
    case "import":
      $("#filePicker").click(); break;
    case "resume": {
      const sid = t.getAttribute("data-sid");
      if (loadSession(sid)) { ui.step = session.tasks.length > 0 ? "inventory" : "person"; render(); }
      else toast("Couldn't load that session.");
      break;
    }
    case "delete": {
      const sid = t.getAttribute("data-sid");
      if (confirm("Delete this saved session? This can't be undone.")) {
        deleteSavedSession(sid); render();
      }
      break;
    }
    case "goto":
      e.preventDefault(); go(t.getAttribute("data-step")); break;
    case "skip-person":
      go("inventory"); break;
    case "inv-tab":
      ui.inventoryTab = t.getAttribute("data-tab"); render(); break;
    case "inv-tool":
      ui.inventoryTool = t.getAttribute("data-tool"); render(); break;
    case "copy-prompt":
      copyToClipboard(PROMPTS[ui.inventoryTool].text).then((ok) => toast(ok ? "Prompt copied — paste it into " + PROMPTS[ui.inventoryTool].label : "Copy failed — select the text manually"));
      break;
    case "parse-paste": {
      const text = $("#pasteInput").value;
      ui.parsedPreview = parsePastedTasks(text);
      render();
      break;
    }
    case "clear-paste":
      $("#pasteInput").value = ""; ui.parsedPreview = null; render(); break;
    case "preview-remove": {
      const i = parseInt(t.getAttribute("data-idx"), 10);
      if (ui.parsedPreview && ui.parsedPreview.tasks) { ui.parsedPreview.tasks.splice(i, 1); render(); }
      break;
    }
    case "commit-preview":
      commitPreview(); break;
    case "discard-preview":
      ui.parsedPreview = null; render(); break;
    case "chip-add":
      addChipTask(t.getAttribute("data-label")); break;
    case "manual-add": {
      const inp = $("#manualTaskInput");
      addManualTask(inp.value); inp.value = ""; inp.focus();
      break;
    }
    case "task-remove":
      removeTask(t.getAttribute("data-id")); break;
    case "diag":
      setDiag(t.getAttribute("data-id"), t.getAttribute("data-val")); break;
    case "bucket":
      setBucket(t.getAttribute("data-bucket")); break;
    case "prev-task":
      if (ui.currentTaskIdx > 0) { ui.currentTaskIdx--; render(); }
      break;
    case "next-task":
      nextTask(); break;
    case "toggle-top":
      toggleTopMove(t.getAttribute("data-id")); break;
    case "export-json":
      exportJson(); break;
    case "export-html":
      exportHtmlSnapshot(); break;
    case "copy-rerun":
      copyRerunInvite(); break;
    case "open-copilot-rerun":
      openCopilotRerun(); break;
    case "copy-rerun-invite":
      copyRerunMeetingInvite(); break;
    case "copy-plan-for-copilot":
      copyPlanForCopilot(); break;
    case "copy-context-for-de":
      copyContextForDigitalEmployees(); break;
    default: break;
  }
}

function onInput(e) {
  const t = e.target;
  const act = t.getAttribute && t.getAttribute("data-act");
  if (!act) return;
  switch (act) {
    case "reason": {
      const id = t.getAttribute("data-id");
      const task = session.tasks.find((x) => x.id === id);
      if (task) { if (!task.diagnostic) task.diagnostic = {}; task.diagnostic.freeformReasoning = t.value; save({ silent: true }); }
      break;
    }
    case "task-edit-label": {
      const id = t.getAttribute("data-id");
      const task = session.tasks.find((x) => x.id === id);
      if (task) { task.label = t.value; save({ silent: true }); }
      break;
    }
    case "task-edit-hours": {
      const id = t.getAttribute("data-id");
      const task = session.tasks.find((x) => x.id === id);
      if (task) {
        const v = parseFloat(t.value);
        task.estHoursPerCadence = isFinite(v) && v >= 0 ? v : null;
        // Convert to weekly equivalent for weighting
        const cadenceMultiplier = { daily: 5, weekly: 1, biweekly: 0.5, monthly: 12/52, quarterly: 4/52, adhoc: 0.5, unknown: 1 };
        const mult = cadenceMultiplier[task.cadence] || 1;
        task.estWeeklyHours = task.estHoursPerCadence != null ? +(task.estHoursPerCadence * mult).toFixed(2) : null;
        task.effortWeight = task.estWeeklyHours != null && task.estWeeklyHours > 0 ? task.estWeeklyHours : 1;
        save({ silent: true });
      }
      break;
    }
    case "move-owner": {
      const id = t.getAttribute("data-id");
      const task = session.tasks.find((x) => x.id === id);
      if (task) { if (!task.move) task.move = {}; task.move.ownerOrTool = t.value; save({ silent: true }); }
      break;
    }
    case "move-prompt": {
      const id = t.getAttribute("data-id");
      const task = session.tasks.find((x) => x.id === id);
      if (task) { if (!task.move) task.move = {}; task.move.starterPrompt = t.value; save({ silent: true }); }
      break;
    }
    case "move-next": {
      const id = t.getAttribute("data-id");
      const task = session.tasks.find((x) => x.id === id);
      if (task) { if (!task.move) task.move = {}; task.move.nextStep = t.value; save({ silent: true }); }
      break;
    }
    case "traj": {
      const key = t.getAttribute("data-key");
      const v = parseFloat(t.value);
      if (!session.plan.ninetyDayTrajectory) session.plan.ninetyDayTrajectory = { targetAutomatePercent: null, targetAssistPercent: null, targetHumanPercent: null, narrative: "" };
      session.plan.ninetyDayTrajectory[key] = isFinite(v) ? Math.max(0, Math.min(100, v)) : null;
      save({ silent: true });
      break;
    }
    case "traj-narrative":
      if (!session.plan.ninetyDayTrajectory) session.plan.ninetyDayTrajectory = { targetAutomatePercent: null, targetAssistPercent: null, targetHumanPercent: null, narrative: "" };
      session.plan.ninetyDayTrajectory.narrative = t.value; save({ silent: true });
      break;
    default: break;
  }
}

function onChange(e) {
  const t = e.target;
  const act = t.getAttribute && t.getAttribute("data-act");
  if (!act) return;
  switch (act) {
    case "task-edit-cadence": {
      const id = t.getAttribute("data-id");
      const task = session.tasks.find((x) => x.id === id);
      if (task) {
        task.cadence = t.value;
        // Recompute weekly equivalent if hours per cadence is set
        if (task.estHoursPerCadence != null) {
          const cadenceMultiplier = { daily: 5, weekly: 1, biweekly: 0.5, monthly: 12/52, quarterly: 4/52, adhoc: 0.5, unknown: 1 };
          const mult = cadenceMultiplier[task.cadence] || 1;
          task.estWeeklyHours = +(task.estHoursPerCadence * mult).toFixed(2);
          task.effortWeight = task.estWeeklyHours > 0 ? task.estWeeklyHours : 1;
        }
        save({ silent: true });
        render();
      }
      break;
    }
    case "move-intent": {
      const id = t.getAttribute("data-id");
      const task = session.tasks.find((x) => x.id === id);
      if (task) { if (!task.move) task.move = {}; task.move.intent = t.value; save({ silent: true }); }
      break;
    }
    case "move-by": {
      const id = t.getAttribute("data-id");
      const task = session.tasks.find((x) => x.id === id);
      if (task) { if (!task.move) task.move = {}; task.move.byWhen = t.value || null; save({ silent: true }); }
      break;
    }
    default: break;
  }
}

function onKey(e) {
  if (e.key === "Enter" && document.activeElement && document.activeElement.id === "manualTaskInput") {
    const inp = $("#manualTaskInput");
    if (inp) { addManualTask(inp.value); inp.value = ""; }
  }
}

// ---- task ops ----

function commitPreview() {
  if (!ui.parsedPreview || !ui.parsedPreview.ok) return;
  // dedupe by label (case-insensitive)
  const existing = new Set(session.tasks.map((t) => t.label.toLowerCase().trim()));
  let added = 0, skipped = 0;
  for (const t of ui.parsedPreview.tasks) {
    if (existing.has(t.label.toLowerCase().trim())) { skipped++; continue; }
    session.tasks.push(t);
    existing.add(t.label.toLowerCase().trim());
    added++;
  }
  session.preferences.preSeedSource = ui.inventoryTool === "m365" ? "graph" : ui.inventoryTool === "workiq" ? "graph" : "manual-paste";
  ui.parsedPreview = null;
  save();
  render();
  toast(`Added ${added}${skipped > 0 ? ` · skipped ${skipped} duplicate${skipped === 1 ? "" : "s"}` : ""}`);
}

function addChipTask(label) {
  if (!label) return;
  if (session.tasks.some((t) => t.label.toLowerCase().trim() === label.toLowerCase().trim())) return;
  session.tasks.push({
    id: slugify(label) + "-" + Math.random().toString(36).slice(2, 6),
    label, description: "",
    cadence: "weekly",
    estWeeklyHours: null,
    effortWeight: 1,
    source: "user",
    bucket: "unsorted",
    diagnostic: {},
    move: null,
    tags: [],
    notes: ""
  });
  save();
  render();
}

function addManualTask(label) {
  label = (label || "").trim();
  if (!label) return;
  if (session.tasks.some((t) => t.label.toLowerCase().trim() === label.toLowerCase().trim())) {
    toast("That task is already in your list.");
    return;
  }
  session.tasks.push({
    id: slugify(label) + "-" + Math.random().toString(36).slice(2, 6),
    label, description: "",
    cadence: "unknown",
    estWeeklyHours: null,
    effortWeight: 1,
    source: "user",
    bucket: "unsorted",
    diagnostic: {},
    move: null,
    tags: [],
    notes: ""
  });
  save();
  render();
}

function removeTask(id) {
  const idx = session.tasks.findIndex((t) => t.id === id);
  if (idx < 0) return;
  session.tasks.splice(idx, 1);
  // also unstar from top moves
  if (session.plan && Array.isArray(session.plan.topMovesThisWeek)) {
    session.plan.topMovesThisWeek = session.plan.topMovesThisWeek.filter((m) => m.taskId !== id);
  }
  if (ui.currentTaskIdx >= session.tasks.length) ui.currentTaskIdx = Math.max(0, session.tasks.length - 1);
  save();
  render();
}

function setDiag(qid, val) {
  const task = session.tasks[ui.currentTaskIdx];
  if (!task) return;
  if (!task.diagnostic) task.diagnostic = {};
  if (val === "yes") task.diagnostic[qid] = true;
  else if (val === "no") task.diagnostic[qid] = false;
  else delete task.diagnostic[qid];
  save({ silent: true });
  // Auto-show mini-lesson the first time a bucket is suggested
  const suggested = suggestedBucketFor(task);
  if (suggested && !ui.miniLessonsShown[suggested]) ui.miniLessonsShown[suggested] = true;
  render();
}

function setBucket(b) {
  const task = session.tasks[ui.currentTaskIdx];
  if (!task) return;
  task.bucket = b;
  // initialize move based on bucket
  if (!task.move) task.move = { intent: BUCKETS[b].intent, ownerOrTool: "", starterPrompt: "", nextStep: "", byWhen: null };
  else task.move.intent = task.move.intent || BUCKETS[b].intent;
  if (b !== "unsorted" && !ui.miniLessonsShown[b]) ui.miniLessonsShown[b] = true;
  save();
  render();
}

function nextTask() {
  if (ui.currentTaskIdx < session.tasks.length - 1) {
    ui.currentTaskIdx++;
    render();
  } else if (allSorted()) {
    go("assess");
  } else {
    // jump to first unsorted
    const i = session.tasks.findIndex((t) => t.bucket === "unsorted");
    if (i >= 0) { ui.currentTaskIdx = i; render(); }
    else go("assess");
  }
}

function toggleTopMove(id) {
  const task = session.tasks.find((t) => t.id === id);
  if (!task) return;
  if (!Array.isArray(session.plan.topMovesThisWeek)) session.plan.topMovesThisWeek = [];
  const i = session.plan.topMovesThisWeek.findIndex((m) => m.taskId === id);
  if (i >= 0) session.plan.topMovesThisWeek.splice(i, 1);
  else {
    if (session.plan.topMovesThisWeek.length >= 5) {
      toast("Top moves limit reached (5). Unstar one first.");
      return;
    }
    session.plan.topMovesThisWeek.push({
      taskId: id,
      label: task.label,
      intent: (task.move && task.move.intent) || BUCKETS[task.bucket].intent,
      nextStep: (task.move && task.move.nextStep) || "",
      byWhen: (task.move && task.move.byWhen) || null
    });
  }
  save();
  render();
}

// ---- export ----

function refreshTopMoves() {
  if (!Array.isArray(session.plan.topMovesThisWeek)) return;
  session.plan.topMovesThisWeek = session.plan.topMovesThisWeek.map((mv) => {
    const t = session.tasks.find((x) => x.id === mv.taskId);
    if (!t) return null;
    const m = t.move || {};
    return {
      taskId: t.id,
      label: t.label,
      intent: m.intent || (BUCKETS[t.bucket] && BUCKETS[t.bucket].intent) || "hold",
      nextStep: m.nextStep || "",
      byWhen: m.byWhen || null
    };
  }).filter(Boolean);
}

function buildExportPayload() {
  computeAssessment();
  refreshTopMoves();
  session.meta.surface = "web-companion";
  if (!session.meta.completedAt && allSorted()) session.meta.completedAt = nowIso();
  return { ...session, aiwfdInterop: buildAiwfdInterop() };
}

function exportJson() {
  const payload = buildExportPayload();
  const stamp = new Date().toISOString().slice(0, 10);
  const fname = `move-the-work_${(session.person.name || "session").replace(/[^a-z0-9-]+/gi, "-").toLowerCase()}_${stamp}.json`;
  downloadBlob(fname, JSON.stringify(payload, null, 2), "application/json");
  toast("Session JSON downloaded — keep it safe for your re-run.");
  save();
}

function exportHtmlSnapshot() {

    h3{font-size:1.05rem;margin:16px 0 6px 0}
    .meta{color:#5c5c5c;font-size:0.9rem}
    .bar{display:flex;height:36px;border-radius:8px;overflow:hidden;border:1px solid #dedede;margin:10px 0}
    .bar > div{color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:10pt}
    .b1{background:#f59e0b}.b2{background:#0078d4}.b3{background:#16a34a}
    .bar-labels{display:flex;margin:-4px 0 10px 0;font-size:9pt;font-weight:600;color:#5c5c5c}
    .bar-labels > div{display:flex;align-items:center;gap:4px}
    .bar-labels .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
    .zone{display:inline-block;padding:4px 10px;color:#fff;font-weight:700;border-radius:6px;letter-spacing:0.04em;font-size:9pt}
    .zoneline{display:flex;align-items:center;gap:10px;margin:6px 0 10px 0}
    table{border-collapse:collapse;width:100%;margin:8px 0}
    th,td{text-align:left;padding:6px 10px;border-bottom:1px solid #eee;vertical-align:top;font-size:10pt}
    th{font-weight:600;background:#f7f4ef}
    .badge{display:inline-block;font-size:0.8rem;padding:2px 8px;border-radius:999px;color:#fff;font-weight:600}
    .bb1{background:#f59e0b}.bb2{background:#0078d4}.bb3{background:#16a34a}.bbu{background:#919191}
    .callout{background:#f7f4ef;border-left:3px solid #b11f4b;padding:10px 14px;margin:14px 0;border-radius:0 8px 8px 0}
    .muted{color:#5c5c5c}
    .moves{padding:0;margin:4px 0}
    .move{display:flex;gap:10px;padding:8px 10px;border:1px solid #dedede;border-radius:6px;margin-bottom:6px}
    .move .n{font-weight:700;color:#b11f4b;font-size:12pt;line-height:1;min-width:18px}
    .move .body{flex:1}
    .move .top{display:flex;gap:8px;align-items:baseline;margin-bottom:2px}
    .move .label{font-weight:600}
    .move .mbadge{font-size:8pt;padding:1px 7px;border-radius:999px;color:#fff;font-weight:700;letter-spacing:0.04em}
    .move .next{color:#5c5c5c;font-size:10pt}
    .move .when{color:#6f6f6f;font-style:italic;font-size:9pt;margin-left:6px}
    .narrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0}
    .narrow > div{background:#f7f4ef;border:1px solid #dedede;border-radius:6px;padding:10px 12px}
    .prompts ul{padding-left:18px;margin:4px 0}
    .prompts li{margin-bottom:4px;font-size:10pt}
    .footer{margin-top:14px;padding-top:10px;border-top:1px solid #dedede;font-size:9pt;color:#5c5c5c;display:flex;justify-content:space-between;align-items:baseline}
    .footer a{color:#0078d4;text-decoration:none}
    @media print{body{padding:0}h2{break-after:avoid}}
  `;

  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Move the Work — ${escapeHtmlSnapshot(p.person.name || "Snapshot")} — ${escapeHtmlSnapshot(stamp)}</title><style>${css}</style></head>
<body>
  <div class="hdr">
    <div>
      <div class="brand">Move <span class="a">the</span> Work</div>
      <div class="tag">Hand the toil to AI. Reclaim the work that only you can do.</div>
    </div>
    <div style="text-align:right;font-size:9pt;color:#5c5c5c">
      Run ${p.meta.runNumber || 1} · ${escapeHtmlSnapshot(stamp)}
    </div>
  </div>
  <div class="meta" style="margin-bottom:14px">${escapeHtmlSnapshot(personLine)}</div>

  <h2>Your map</h2>
  <div class="bar">
    ${a.bucketPercents.automate > 0 ? `<div class="b1" style="flex:${a.bucketPercents.automate}">${Math.round(a.bucketPercents.automate)}%</div>` : ""}
    ${a.bucketPercents.assist   > 0 ? `<div class="b2" style="flex:${a.bucketPercents.assist}">${Math.round(a.bucketPercents.assist)}%</div>` : ""}
    ${a.bucketPercents.human    > 0 ? `<div class="b3" style="flex:${a.bucketPercents.human}">${Math.round(a.bucketPercents.human)}%</div>` : ""}
  </div>
  <div class="bar-labels" style="justify-content:space-between">
    <div><span class="dot" style="background:#f59e0b"></span> Bucket 1 · Automate (AI does it)</div>
    <div><span class="dot" style="background:#0078d4"></span> Bucket 2 · Assist (AI + you)</div>
    <div><span class="dot" style="background:#16a34a"></span> Bucket 3 · Human (Only you)</div>
  </div>
  <div class="zoneline">
    <span class="zone" style="background:${zoneColor}">${zoneLabel}</span>
    <span style="font-size:10pt;color:#242424">${a.vulnerabilityRead.summary}</span>
  </div>

  <h2>Top moves</h2>
  <div class="moves">
    ${tops.length === 0
      ? `<div class="move"><div class="body" style="color:#6f6f6f;font-style:italic">No top moves starred.</div></div>`
      : tops.map((mv, i) => `
        <div class="move">
          <div class="n">${i + 1}</div>
          <div class="body">
            <div class="top">
              <span class="label">${escapeHtmlSnapshot(mv.label)}</span>
              <span class="mbadge" style="background:${intentColor(mv.intent)}">${escapeHtmlSnapshot(intentLabel(mv.intent).toUpperCase())}</span>
              ${mv.byWhen ? `<span class="when">by ${escapeHtmlSnapshot(fmtDate(mv.byWhen))}</span>` : ""}
            </div>
            <div class="next">${escapeHtmlSnapshot(mv.nextStep || "(no next step written)")}</div>
          </div>
        </div>
      `).join("")
    }
  </div>

  <h2>Full task inventory</h2>
  <table><thead><tr><th>Task</th><th>Bucket</th><th>Cadence</th><th>Effort</th></tr></thead><tbody>${tasksRows}</tbody></table>

  <h2>All moves</h2>
  ${movesRows ? `<table><thead><tr><th>Task</th><th>Intent</th><th>Owner / tool</th><th>Next step</th><th>By when</th></tr></thead><tbody>${movesRows}</tbody></table>` : `<p class="muted">No moves written yet.</p>`}

  <h2>90-day trajectory</h2>
  <div style="font-size:10pt;margin-bottom:4px">${trajLine}</div>
  ${traj.narrative ? `<div class="callout">"${escapeHtmlSnapshot(traj.narrative)}"</div>` : ""}

  <h2>Bring this to a conversation</h2>
  <div class="narrow prompts">
    <div>
      <strong style="font-size:10pt">In your next 1:1 with your manager</strong>
      <ul>
        <li>"Here's where my time actually goes today — does the mix look right to you?"</li>
        <li>"These are the three moves I'm making this week."</li>
        <li>"What do you see in Bucket 3 that I might be undervaluing?"</li>
      </ul>
    </div>
    <div>
      <strong style="font-size:10pt">With your team</strong>
      <ul>
        <li>"What's on your list that should be on someone else's?"</li>
        <li>"Where are we all over-investing in tasks AI could do?"</li>
        <li>"Where does our team need to grow Bucket 3 work?"</li>
      </ul>
    </div>
  </div>

  <h2>Where to go next</h2>
  <p style="font-size:10pt">🤖 <strong>Build your Digital Employees</strong> — Run <code>/digital-employees</code> in Clawpilot to build a personalized AI workforce based on what you learned here.</p>
  <p style="font-size:10pt">🔧 Drop the session JSON into <a href="${HANDOFF.url}">${HANDOFF.tool}</a> — it picks up where Move the Work left off.</p>

  <div class="footer">
    <div>Re-run in 90 days · Import the saved JSON to see what's moved.</div>
    <div>Generated by Move the Work</div>
  </div>
</body></html>`;
}

function escapeHtmlSnapshot(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---- import ----

function onFile(e) {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      importSession(data);
    } catch (_) {
      toast("Couldn't parse that file as JSON.");
    }
  };
  r.readAsText(f);
  e.target.value = "";
}

function importSession(data) {
  if (!data || !data.meta || !Array.isArray(data.tasks)) {
    toast("That doesn't look like a Move the Work session file.");
    return;
  }
  // If user has no current session OR a fresh empty one, treat this as resume-prior-run
  const isFresh = session.tasks.length === 0;
  if (isFresh) {
    // Load as a *new* run that references the imported one
    priorSession = JSON.parse(JSON.stringify(data));
    // start a new run keeping person info
    const next = freshSession();
    next.person = data.person || next.person;
    next.meta.runNumber = (data.meta.runNumber || 1) + 1;
    next.meta.previousRunSessionRef = data.meta.sessionId;
    next.meta.tags = data.meta.tags || [];
    // carry forward tasks (reset bucket to existing assignment so user can revise)
    next.tasks = data.tasks.map((t) => ({
      ...t,
      move: t.move || null
    }));
    session = next;
    ensureSessionShape();
    computeAssessment();
    save();
    ui.step = "diff";
    ui.visited.add("diff");
    render();
    toast(`Imported run ${data.meta.runNumber} — here's what changed.`);
  } else {
    if (!confirm("This will replace your current in-progress audit. Continue?")) return;
    session = data;
    ensureSessionShape();
    computeAssessment();
    priorSession = null;
    ui = { step: "inventory", currentTaskIdx: 0, inventoryTab: "prompt", inventoryTool: "m365", miniLessonsShown: { automate: true, assist: true, human: true }, parsedPreview: null, visited: new Set(["welcome","inventory"]) };
    save();
    render();
    toast("Imported session loaded.");
  }
}

// ---- theme & misc ----

function toggleTheme() {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem(STORAGE_THEME_KEY, next); } catch (_) {}
}

function startNewSession() {
  if (session.tasks.length > 0) {
    if (!confirm("Start a fresh audit? Your current one is autosaved on this device — you can resume from the welcome screen.")) return;
  }
  session = freshSession();
  priorSession = null;
  ui = { step: "person", currentTaskIdx: 0, inventoryTab: "prompt", inventoryTool: "m365", miniLessonsShown: { automate: false, assist: false, human: false }, parsedPreview: null, visited: new Set(["welcome","person"]) };
  save();
  render();
}

// ---- init ----

function init() {
  ensureSessionShape();
  bind();
  render();
}

document.addEventListener("DOMContentLoaded", init);


</script>
</body>
</html>
